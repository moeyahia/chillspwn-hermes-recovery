<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ChillsPwn // Command OS</title>
    <link rel="icon" type="image/png" href="/smallLogo.png">
    <!-- Home-screen app (PWA) — iOS + Android -->
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ChillsPwn" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/boot.css" />
  </head>
  <body>
    <div id="root">
      <!-- Boot overlay: shown immediately so the app never appears as a pure blank
           screen on iOS (#42). React replaces #root's children on mount, clearing this.
           If the bundle fails to load / parse (e.g. a stale cached index pointing at a
           since-deleted bundle hash), the watchdog below swaps in a Retry button that
           hard-reloads with cache-busting. -->
      <div id="boot">
        <div class="boot-title">CHILLSPWN // COMMAND OS</div>
        <div id="boot-msg">connecting…</div>
        <div id="boot-actions"></div>
      </div>
    </div>
    <script src="/boot.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
