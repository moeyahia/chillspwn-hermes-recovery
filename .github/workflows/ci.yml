name: Recovery CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: recovery-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.15"
          enable-cache: true
          cache-dependency-glob: hermes/source/uv.lock

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Restore Bun download cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('chillspwn/plugin/webapp/bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Check changed whitespace
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git diff --check "$BASE_SHA" "$HEAD_SHA"
          else
            git diff-tree --check --root "$HEAD_SHA"
          fi

      - name: Verify recovery snapshot
        run: ./scripts/verify-snapshot.sh

      - name: Check shell scripts
        shell: bash
        run: |
          bash -n \
            scripts/restore.sh \
            scripts/verify-snapshot.sh \
            chillspwn/plugin/webapp/scripts/setup-mcp-arsenal.sh \
            chillspwn/plugin/webapp/scripts/setup-security-assets.sh

      - name: Install ChillsPwn dependencies
        working-directory: chillspwn/plugin/webapp
        run: bun install --frozen-lockfile

      - name: Parse and bundle production server entry
        working-directory: chillspwn/plugin/webapp
        run: bun run check:server-entry

      - name: Typecheck modular server
        working-directory: chillspwn/plugin/webapp
        run: bun run typecheck

      - name: Typecheck client
        working-directory: chillspwn/plugin/webapp
        run: bun run typecheck:client

      - name: Run ChillsPwn unit tests
        working-directory: chillspwn/plugin/webapp
        run: bun test ./server ./src/lib

      - name: Run portable gate integration tests
        working-directory: chillspwn/plugin/webapp
        run: |
          python3 integration/test_or_gate_client.py
          python3 integration/test_board_mcp_server.py

      - name: Build production client
        working-directory: chillspwn/plugin/webapp
        run: bun run build

      - name: Audit web dependencies
        working-directory: chillspwn/plugin/webapp
        run: bun audit

      - name: Validate Hermes dependency lock
        working-directory: hermes/source
        run: uv lock --check

      - name: Install locked config-validator dependency
        run: uv pip install --system "pyyaml==6.0.3"

      - name: Compile retained Hermes entry points
        run: |
          python3 -m compileall -q \
            hermes/source/agent \
            hermes/source/acp_adapter \
            hermes/source/hermes_cli \
            hermes/source/run_agent.py \
            hermes/source/tools/memory_tool.py \
            hermes/runtime/scripts/chillspwn_learn_cron.py \
            hermes/runtime/skills/red-teaming/council-of-ais/scripts \
            scripts/chillspwn-memory-broker.py

      - name: Run ChillsPwn learning pipeline regressions
        run: |
          python3 -m unittest hermes/runtime/tests/test_chillspwn_learning_pipeline.py
          python3 -m unittest hermes/runtime/tests/test_validate_hermes_config.py
