name: Feature request
description: Propose a maintainable application or recovery improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Describe the operator or recovery problem without including live credentials, targets, or private infrastructure details.
  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-flight checks
      options:
        - label: I searched existing issues and documentation.
          required: true
        - label: I removed sensitive and engagement-specific information.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What operator, maintainer, or recovery problem should be solved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution and expected behavior
      description: Describe the workflow, configuration, and intended outcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Security, privacy, compatibility, and recovery impact
      description: Cover credentials, provider/tool boundaries, data, migrations, deployment, rollback, and authorization.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Acceptance criteria and testing evidence
      description: Explain how maintainers can prove the change works and preserves existing boundaries.
    validations:
      required: true
  - type: textarea
    id: visuals
    attributes:
      label: Sanitized screenshots or mockups
      description: Include these when they materially improve understanding.
  - type: textarea
    id: related
    attributes:
      label: Related issues, dependencies, or prior art
  - type: checkboxes
    id: checklist
    attributes:
      label: Contributor checklist
      options:
        - label: I am willing to help implement and document this feature.
        - label: I can add or update automated tests.
